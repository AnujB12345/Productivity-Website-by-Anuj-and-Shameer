[pytest]
# Points directly to your settings file
DJANGO_SETTINGS_MODULE = mySite.settings

# Adds apps/backend to Python's import path so apps like 'dashboard', 'todo', 'users' can be imported without errors
pythonpath = apps/backend

# General pytest options:
# -ra : summarizes non-passing tests at the end
# -q  : keeps terminal output concise
addopts = -ra -q

# File naming conventions for tests
python_files = test_*.py *_test.py tests.py