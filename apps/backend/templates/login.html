{% extends 'base.html' %}

{% block extra_css %}  
<link rel = "stylesheet" href = "{% static 'css/login.css' %}">

{% endblock%}

{% block content %}

{% if messages %}
	{% for message in messages %}
		<div class="message {{ message.tags }}">
			{{ message }}
		</div>
	{% endfor %}
{% endif %}

<form method="POST" novalidate>
	{% csrf_token %}
	<h2>Login</h2>
	{{form.as_p}}
	<input type="submit" value="Login" />
</form>

{% endblock content%}
